<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1f2937">
<title>Organizador IA</title>
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#f3f4f6;color:#111827}
header{background:#1f2937;color:#fff;padding:20px 16px}h1{margin:0 0 5px;font-size:24px}header p{margin:0;color:#d1d5db}
main{max-width:850px;margin:auto;padding:16px}.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:16px;box-shadow:0 2px 10px #0001}
button{border:0;border-radius:12px;padding:13px 16px;font-size:16px;font-weight:600}.primary{background:#111827;color:#fff;width:100%}
input[type=file]{display:none}.status{margin-top:12px;padding:10px;background:#f3f4f6;border-radius:10px}
.file{border:1px solid #ddd;border-radius:12px;padding:12px;margin-top:10px}.name{font-weight:700;word-break:break-word}
.meta{font-size:13px;color:#666;margin-top:5px}.remove{margin-top:10px;background:#fee2e2;color:#991b1b;padding:8px 10px;font-size:13px}
.empty{text-align:center;color:#666;padding:20px}
.preview{margin-top:10px;background:#f9fafb;border:1px solid #eee;border-radius:8px;padding:10px;white-space:pre-wrap;word-break:break-word;max-height:180px;overflow:auto;font-size:13px}
</style>
</head>
<body>
<header><h1>📁 Organizador IA</h1><p>Prueba estable de selección y lectura</p></header>
<main>
<div class="card">
<button id="selectFiles" class="primary" type="button">📂 Seleccionar archivos</button>
<input id="files" type="file" multiple>
<div id="status" class="status">Esperando selección…</div>
</div>
<div class="card">
<strong id="summary">Archivos seleccionados: 0</strong>
<div id="fileList" class="empty">Aquí aparecerán los archivos seleccionados.</div>
</div>
</main>
<script>
(function(){
"use strict";
var input=document.getElementById("files");
var button=document.getElementById("selectFiles");
var status=document.getElementById("status");
var list=document.getElementById("fileList");
var summary=document.getElementById("summary");
var selected=[];

function size(n){if(n<1024)return n+" B";if(n<1048576)return(n/1024).toFixed(1)+" KB";return(n/1048576).toFixed(1)+" MB";}

function render(){
 summary.textContent="Archivos seleccionados: "+selected.length;
 if(!selected.length){list.className="empty";list.textContent="Aquí aparecerán los archivos seleccionados.";return;}
 list.className="";list.innerHTML="";
 selected.forEach(function(file,index){
  var box=document.createElement("div");box.className="file";
  var name=document.createElement("div");name.className="name";name.textContent="📄 "+file.name;
  var meta=document.createElement("div");meta.className="meta";
  meta.textContent="Tipo: "+(file.type||"desconocido")+" · Tamaño: "+size(file.size);
  var preview=document.createElement("div");preview.className="preview";preview.textContent="Contenido todavía no leído.";
  var remove=document.createElement("button");remove.className="remove";remove.type="button";remove.textContent="✕ Quitar";
  remove.onclick=function(){selected.splice(index,1);render();};
  box.appendChild(name);box.appendChild(meta);box.appendChild(preview);box.appendChild(remove);
  list.appendChild(box);
 });
}

button.addEventListener("click",function(){input.click();});

input.addEventListener("change",function(){
 var files=input.files;
 status.textContent="Evento recibido. Archivos detectados: "+(files?files.length:0);
 if(files){
  for(var i=0;i<files.length;i++){selected.push(files[i]);}
 }
 input.value="";
 render();
});

render();
})();
</script>
</body>
</html>
