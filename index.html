<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#17324d">
<link rel="manifest" href="./manifest.webmanifest">
<title>Organizador IA</title>
<style>
body{font-family:system-ui;margin:0;background:#f3f6f9;color:#17212b}.app{max-width:900px;margin:auto;padding:18px}
header,.panel{background:white;border-radius:20px;padding:20px;margin-bottom:16px;box-shadow:0 4px 18px #0001}
header{background:#17324d;color:white}.actions{display:flex;gap:10px;flex-wrap:wrap}
button{padding:13px 18px;border:0;border-radius:12px;font-weight:700;font-size:16px;background:#17324d;color:white}
#files{display:none}.muted{color:#667581}
</style>
</head>
<body>
<div class="app">
<header><h1>Organizador IA</h1><div>Selecciona archivos para analizarlos. Esta versión no modifica ningún archivo.</div><small>V1.3 TEST · selector Android</small></header>
<section class="panel">
<div class="actions">
<button type="button" id="selectFiles">📂 Seleccionar archivos</button>
<input id="files" type="file" multiple accept=".pdf,.docx,.txt,.csv,.md,.json,.xml,.html,.htm,image/*">
</div>
<p id="status" class="muted">Pulsa el botón para seleccionar uno o varios archivos.</p>
</section>
</div>
<script>
(function(){
"use strict";
var input=document.getElementById("files");
var button=document.getElementById("selectFiles");
var status=document.getElementById("status");
button.addEventListener("click",function(){
  input.click();
});
input.addEventListener("change",function(){
  var n=input.files ? input.files.length : 0;
  status.textContent=n ? ("Seleccionados: "+n+" archivo(s).") : "No se ha seleccionado ningún archivo.";
});
})();
</script>
</body>
</html>
