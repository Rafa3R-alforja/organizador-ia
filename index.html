<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Organizador IA — Prueba PDF 04 OCR</title>
<style>
body{font-family:Arial,sans-serif;max-width:900px;margin:auto;padding:20px;background:#f5f7fa;color:#17202a}
button{font-size:18px;padding:14px 20px;border:0;border-radius:12px;background:#2563eb;color:white}
input{display:none}.box{background:white;border-radius:14px;padding:18px;margin-top:18px;box-shadow:0 2px 10px #0001}
pre{white-space:pre-wrap;word-break:break-word;max-height:60vh;overflow:auto}
.ok{color:#16733b}.warn{color:#9a6700}.err{color:#b42318}
.bar{margin-top:12px;padding:10px;background:#eef2ff;border-radius:10px}
</style>
</head>
<body>
<h1>📄 Organizador IA — Prueba PDF 04</h1>
<p>Extracción normal + OCR automático para PDF escaneado.</p>
<button id="btn">📂 Seleccionar PDF</button>
<input id="pdfFile" type="file" accept=".pdf,application/pdf">
<div id="result" class="box">Selecciona un PDF.</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
(function(){
 const btn=document.getElementById("btn"), input=document.getElementById("pdfFile"), result=document.getElementById("result");
 if(window.pdfjsLib) window.pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

 btn.addEventListener("click",()=>input.click());

 input.addEventListener("change",async()=>{
   const file=input.files&&input.files[0]; if(!file)return;
   result.innerHTML="<b>⏳ Analizando PDF…</b>";
   try{
     if(!window.pdfjsLib) throw new Error("PDF.js no se ha cargado.");
     const buffer=await file.arrayBuffer();
     const pdf=await window.pdfjsLib.getDocument({data:new Uint8Array(buffer)}).promise;
     let text="", pagesWithText=0, maxPages=Math.min(pdf.numPages,30);

     for(let n=1;n<=maxPages;n++){
       const page=await pdf.getPage(n);
       const content=await page.getTextContent();
       const pageText=content.items.map(x=>x.str||"").join(" ").trim();
       if(pageText) pagesWithText++;
       text+="\n\n--- Página "+n+" ---\n"+pageText;
     }

     text=text.trim();
     const chars=text.replace(/--- Página \d+ ---/g,"").trim().length;

     if(chars>=120){
       result.innerHTML='<div class="ok"><b>✅ PDF leído correctamente</b><br>Archivo: '+esc(file.name)+'<br>Método: Texto PDF<br>Páginas: '+pdf.numPages+'<br>Caracteres útiles: '+chars+'</div><pre>'+esc(text)+'</pre>';
       return;
     }

     result.innerHTML='<div class="warn"><b>⚠️ Texto insuficiente</b><br>Se han recuperado '+chars+' caracteres.<br>🔎 Iniciando OCR página por página…</div>';
     let ocrText="";

     const worker=await Tesseract.createWorker("spa",1,{
       logger:m=> {
         if(m && m.status){
           const pct=m.progress ? Math.round(m.progress*100) : 0;
           result.innerHTML='<div class="bar"><b>🔎 OCR en curso</b><br>'+esc(m.status)+' '+pct+'%</div>';
         }
       }
     });

     for(let n=1;n<=maxPages;n++){
       result.innerHTML='<div class="bar"><b>🔎 OCR página '+n+' de '+maxPages+'…</b></div>';
       const page=await pdf.getPage(n);
       const viewport=page.getViewport({scale:2});
       const canvas=document.createElement("canvas");
       canvas.width=Math.ceil(viewport.width);
       canvas.height=Math.ceil(viewport.height);
       const ctx=canvas.getContext("2d");
       await page.render({canvasContext:ctx,viewport}).promise;
       const resultOcr=await worker.recognize(canvas);
       ocrText+="\n\n--- Página "+n+" ---\n"+(resultOcr.data.text||"").trim();
     }

     await worker.terminate();
     ocrText=ocrText.trim();
     const ocrChars=ocrText.length;

     if(ocrChars){
       result.innerHTML='<div class="ok"><b>✅ OCR completado</b><br>Archivo: '+esc(file.name)+'<br>Método: OCR de PDF<br>Páginas: '+pdf.numPages+'<br>Caracteres recuperados: '+ocrChars+'</div><pre>'+esc(ocrText)+'</pre>';
     }else{
       result.innerHTML='<div class="warn"><b>⚠️ OCR no encontró texto</b><br>El PDF parece estar compuesto por imágenes, pero no se ha podido reconocer texto.</div>';
     }
   }catch(err){
     result.innerHTML='<div class="err"><b>❌ Error</b><br>'+esc(err&&err.message?err.message:String(err))+'</div>';
   }
 });

 function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}
})();
</script>
</body>
</html>
